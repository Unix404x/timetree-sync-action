name: TimeTree Sync

on:
  workflow_dispatch:

# Évite deux synchros en même temps si HA relance pendant qu'une tourne
concurrency:
  group: timetree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04      # version fixe : pas de surprise avec la migration vers Ubuntu 26
    timeout-minutes: 10        # coupe une synchro bloquée au lieu de consommer des minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v5          # Node.js 24

      - name: Setup Python
        uses: actions/setup-python@v6      # Node.js 24
        with:
          python-version: "3.12"
          cache: pip                       # installations plus rapides

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ./vendor/timetree_exporter

      - name: Run
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CALENDAR_CODE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          python src/main.py
